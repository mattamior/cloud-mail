project: Cloud Mail
status: active
phase: verified-awaiting-provider-authorization
repository: mattamior/cloud-mail
rpm_ref: zerolocal/cloudflare-validation
provider: cloudflare
runtime: workers
protocol: zerolocal-v0.1
summary: >-
  Cloud Mail is under ZeroLocal on an isolated validation ref. The existing production
  deployment workflow remains untouched. Remote validation passed for the implementation
  candidate, but the isolated Cloudflare deployment stopped at the protected credential
  boundary before any KV, D1, Worker deployment, database initialization, or external
  observation occurred.
requested_intent:
  - initialize official ZeroLocal RPM state
  - verify the existing frontend and Worker remotely
  - create a non-destructive Cloudflare validation deployment
  - prove D1 and KV bindings plus frontend/backend reachability
validation:
  workflow: .github/workflows/zerolocal-validation.yml
  branch: zerolocal/cloudflare-validation
  candidate_revision: b6182583b6282e97dd3204208b0a5d242f387d2b
  workflow_run: 33050376135
  validation_result: passed
  passed_assertions:
    - Worker dependencies install with frozen lockfile
    - frontend dependencies install with frozen lockfile
    - Vue frontend builds to mail-worker/dist
    - isolated Wrangler config renders without protected values
    - Wrangler dry-run validates the Worker bundle, static assets, and declared bindings
  deployment_result: blocked_at_trust_boundary
  failure_category: protected secret
  failure_step: Discover or provision isolated KV namespace
  failure_evidence: >-
    The trusted deploy job received empty CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
    environment values. Wrangler exited before provider resource discovery or creation because
    non-interactive use requires CLOUDFLARE_API_TOKEN.
  health_path: /api/health
  frontend_path: /
validation_resources:
  worker: cloud-mail-zerolocal-validation
  d1: cloud-mail-zerolocal-validation
  kv: cloud-mail-zerolocal-validation
  provider_mutation_status: none from workflow run 33050376135
implemented:
  - ZeroLocal provider descriptor and RPM bootstrap files
  - isolated validation Worker configuration without production route, cron, email, AI, or R2 side effects
  - credential-free remote build/dry-run validation
  - trusted exact-revision validation deploy job
  - idempotent D1 and KV discovery/provisioning
  - backend health endpoint checking D1, KV, assets binding, and deployed revision
  - post-deploy database initialization plus frontend/backend observation
trust_boundaries:
  - name: Cloudflare validation authorization
    action: >-
      Store CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions protected
      secrets available to the zerolocal-validation environment/repository, then rerun the
      failed workflow jobs for run 33050376135.
    minimum_token_scope: >-
      Target Cloudflare account only; Workers Scripts Edit, Workers KV Storage Edit, and D1 Edit.
    secret_values_in_chat: prohibited
blockers:
  - Live validation deployment and observation are blocked until the protected Cloudflare credentials are available to the trusted deploy job.
checkpoint:
  timestamp: 2026-08-27
  reason: remote validation completed and provider trust boundary was reached
  resumability: >-
    RPM is durable on zerolocal/cloudflare-validation, but a fresh ChatGPT Project conversation
    also needs a project bootstrap pointer naming the canonical repository and this RPM ref.
