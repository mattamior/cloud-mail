requested_intent:
  - initialize official ZeroLocal RPM state
  - verify the existing frontend and Worker remotely
  - create a non-destructive Cloudflare validation deployment
  - prove D1 and KV bindings plus frontend/backend reachability
validation:
  workflow: .github/workflows/zerolocal-validation.yml
  branch: zerolocal/cloudflare-validation
  candidate_revision: b6182583b6282e97dd3204208b0a5d242f387d2b
  workflow_run: 33050376135
  validation_result: passed
  passed_assertions:
    - Worker dependencies install with frozen lockfile
    - frontend dependencies install with frozen lockfile
    - Vue frontend builds to mail-worker/dist
    - isolated Wrangler config renders without protected values
    - Wrangler dry-run validates the Worker bundle, static assets, and declared bindings
  deployment_result: blocked_at_provider_account_identity
  latest_attempt: 2
  latest_deploy_job: 98449843043
  failure_category: invalid provider account identifier
  failure_step: Discover or provision isolated KV namespace
  failure_evidence: >-
    The deploy job now receives masked non-empty Cloudflare secret values, but Wrangler's KV
    namespace list request failed at /client/v4/accounts/<masked>/storage/kv/namespaces with
    Cloudflare API code 7003: the account object identifier is invalid. GitHub also masked the
    CLOUDFLARE_ACCOUNT_ID environment variable name itself in the log, strongly suggesting the
    stored secret value may have been the literal string CLOUDFLARE_ACCOUNT_ID rather than the
    actual Cloudflare Account ID.
  health_path: /api/health
  frontend_path: /
validation_resources:
  worker: cloud-mail-zerolocal-validation
  d1: cloud-mail-zerolocal-validation
  kv: cloud-mail-zerolocal-validation
  provider_mutation_status: none from workflow run 33050376135 attempts 1-2
implemented:
  - ZeroLocal provider descriptor and RPM bootstrap files
  - isolated validation Worker configuration without production route, cron, email, AI, or R2 side effects
  - credential-free remote build/dry-run validation
  - trusted exact-revision validation deploy job
  - idempotent D1 and KV discovery/provisioning
  - backend health endpoint checking D1, KV, assets binding, and deployed revision
  - post-deploy database initialization plus frontend/backend observation
trust_boundaries:
  - name: Cloudflare validation authorization
    action: >-
      Replace the GitHub Actions protected CLOUDFLARE_ACCOUNT_ID secret available to the
      zerolocal-validation environment with the actual Account ID copied from the intended
      Cloudflare account, without moving the value through chat, then rerun the failed deploy job.
    minimum_token_scope: >-
      Target Cloudflare account only; Workers Scripts Edit, Workers KV Storage Edit, and D1 Edit.
    secret_values_in_chat: prohibited
blockers:
  - Live validation deployment and observation are blocked until CLOUDFLARE_ACCOUNT_ID identifies the intended Cloudflare account.
checkpoint:
