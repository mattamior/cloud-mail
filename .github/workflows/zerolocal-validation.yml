name: ZeroLocal Validation

on:
  pull_request:
    paths:
      - "ZEROLOCAL.yaml"
      - ".github/workflows/zerolocal-validation.yml"
      - "scripts/**"
      - "mail-worker/**"
      - "mail-vue/**"
  push:
    branches:
      - zerolocal/cloudflare-validation
    paths:
      - "ZEROLOCAL.yaml"
      - ".github/workflows/zerolocal-validation.yml"
      - "scripts/**"
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:
    inputs:
      revision:
        description: Full immutable commit SHA to validate and deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zerolocal-validation
  cancel-in-progress: false

env:
  ZEROLOCAL_WORKER_NAME: cloud-mail-zerolocal-validation
  ZEROLOCAL_D1_NAME: cloud-mail-zerolocal-validation
  ZEROLOCAL_KV_NAME: cloud-mail-zerolocal-validation

jobs:
  validate:
    name: Validate immutable revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Resolve immutable revision
        id: revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ inputs.revision }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$REQUESTED_SHA"
          else
            SHA="$EVENT_SHA"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Revision must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml

      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: mail-vue
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: mail-vue
        run: pnpm run build

      - name: Render non-secret validation config
        env:
          ZEROLOCAL_D1_ID: 00000000-0000-0000-0000-000000000000
          ZEROLOCAL_KV_ID: 00000000000000000000000000000000
          ZEROLOCAL_JWT_SECRET: zerolocal-validation-build-only
          ZEROLOCAL_REVISION: ${{ steps.revision.outputs.sha }}
        run: ./scripts/zerolocal-render-config.sh

      - name: Validate Worker bundle and bindings
        working-directory: mail-worker
        run: pnpm wrangler deploy --dry-run -c wrangler-zerolocal.generated.toml

  deploy-validation:
    name: Deploy isolated validation environment
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/zerolocal/cloudflare-validation') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: zerolocal-validation
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml

      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: mail-vue
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: mail-vue
        run: pnpm run build

      - name: Discover or provision isolated KV namespace
        id: kv
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          KV_LIST="$(pnpm wrangler kv namespace list)"
          KV_ID="$(printf '%s' "$KV_LIST" | jq -r --arg name "$ZEROLOCAL_KV_NAME" '.[] | select(.title == $name) | .id' | head -n1)"
          if [ -z "$KV_ID" ]; then
            pnpm wrangler kv namespace create "$ZEROLOCAL_KV_NAME"
            KV_LIST="$(pnpm wrangler kv namespace list)"
            KV_ID="$(printf '%s' "$KV_LIST" | jq -r --arg name "$ZEROLOCAL_KV_NAME" '.[] | select(.title == $name) | .id' | head -n1)"
          fi
          if [ -z "$KV_ID" ]; then
            echo "Unable to resolve isolated KV namespace" >&2
            exit 1
          fi
          echo "id=$KV_ID" >> "$GITHUB_OUTPUT"

      - name: Discover or provision isolated D1 database
        id: d1
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          DB_LIST="$(pnpm wrangler d1 list --json)"
          D1_ID="$(printf '%s' "$DB_LIST" | jq -r --arg name "$ZEROLOCAL_D1_NAME" '.[] | select(.name == $name) | .uuid' | head -n1)"
          if [ -z "$D1_ID" ]; then
            pnpm wrangler d1 create "$ZEROLOCAL_D1_NAME"
            DB_LIST="$(pnpm wrangler d1 list --json)"
            D1_ID="$(printf '%s' "$DB_LIST" | jq -r --arg name "$ZEROLOCAL_D1_NAME" '.[] | select(.name == $name) | .uuid' | head -n1)"
          fi
          if [ -z "$D1_ID" ]; then
            echo "Unable to resolve isolated D1 database" >&2
            exit 1
          fi
          echo "id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Create ephemeral app secret and render deployment config
        id: runtime
        shell: bash
        env:
          ZEROLOCAL_D1_ID: ${{ steps.d1.outputs.id }}
          ZEROLOCAL_KV_ID: ${{ steps.kv.outputs.id }}
          ZEROLOCAL_REVISION: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          ZEROLOCAL_JWT_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$ZEROLOCAL_JWT_SECRET"
          export ZEROLOCAL_JWT_SECRET
          ./scripts/zerolocal-render-config.sh
          echo "jwt_secret=$ZEROLOCAL_JWT_SECRET" >> "$GITHUB_OUTPUT"

      - name: Deploy exact validated revision
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mail-worker
          command: deploy -c wrangler-zerolocal.generated.toml

      - name: Resolve deployment endpoint
        id: endpoint
        shell: bash
        env:
          RAW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$RAW_DEPLOYMENT_URL" | awk '{print $1}')"
          if [ -z "$HOST" ]; then
            echo "Cloudflare deploy did not expose a deployment URL" >&2
            exit 1
          fi
          case "$HOST" in
            http://*|https://*) URL="$HOST" ;;
            *) URL="https://$HOST" ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Initialize isolated D1 schema
        shell: bash
        env:
          URL: ${{ steps.endpoint.outputs.url }}
          JWT_SECRET: ${{ steps.runtime.outputs.jwt_secret }}
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/api/init/$JWT_SECRET")"
          test "$BODY" = "success"

      - name: Verify backend and stateful bindings
        shell: bash
        env:
          URL: ${{ steps.endpoint.outputs.url }}
          REVISION: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/api/health" -o health.json
          jq -e --arg revision "$REVISION" '
            .status == "ok" and
            .revision == $revision and
            .checks.d1 == true and
            .checks.kv == true and
            .checks.assets == true
          ' health.json >/dev/null
          cat health.json

      - name: Verify frontend
        shell: bash
        env:
          URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$URL/" -o frontend.html
          grep -q 'id="app"' frontend.html

      - name: Record observable validation evidence
        shell: bash
        env:
          URL: ${{ steps.endpoint.outputs.url }}
          REVISION: ${{ needs.validate.outputs.sha }}
        run: |
          {
            echo "### ZeroLocal Cloudflare validation"
            echo "- Revision: \`$REVISION\`"
            echo "- Endpoint: $URL"
            echo "- Worker: \`$ZEROLOCAL_WORKER_NAME\`"
            echo "- D1: \`$ZEROLOCAL_D1_NAME\`"
            echo "- KV: \`$ZEROLOCAL_KV_NAME\`"
            echo "- Backend: \`/api/health\` observed healthy"
            echo "- Frontend: \`/\` observed with Cloud Mail app shell"
          } >> "$GITHUB_STEP_SUMMARY"
