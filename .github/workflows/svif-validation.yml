name: Svif Validation

on:
  pull_request:
    paths:
      - "AGNIR.yaml"
      - "SVIF.yaml"
      - ".agnir/**"
      - "adapters/**"
      - "validation/**"
      - "conformance/**"
      - ".github/workflows/svif-validation.yml"
      - "scripts/**"
      - "mail-worker/**"
      - "mail-vue/**"
  push:
    branches:
      - svif/cloudflare-validation
    paths:
      - "AGNIR.yaml"
      - "SVIF.yaml"
      - ".agnir/**"
      - "adapters/**"
      - "validation/**"
      - "conformance/**"
      - ".github/workflows/svif-validation.yml"
      - "scripts/**"
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:
    inputs:
      revision:
        description: Full immutable commit SHA to validate and optionally deliver
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: svif-validation
  cancel-in-progress: false

env:
  SVIF_WORKER_NAME: cloud-mail-svif-validation
  SVIF_D1_NAME: cloud-mail-svif-validation
  SVIF_KV_NAME: cloud-mail-svif-validation

jobs:
  validate:
    name: Verify immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Resolve immutable candidate
        id: candidate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ inputs.revision }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$REQUESTED_SHA"
          else
            SHA="$EVENT_SHA"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Revision must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify Svif and Agnir validation contracts
        run: python conformance/check_svif_validation.py

      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: mail-vue
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: mail-vue
        run: pnpm run build

      - name: Render non-secret validation config
        env:
          SVIF_D1_ID: 00000000-0000-0000-0000-000000000000
          SVIF_KV_ID: 00000000000000000000000000000000
          SVIF_JWT_SECRET: svif-validation-build-only
          SVIF_REVISION: ${{ steps.candidate.outputs.sha }}
        run: ./scripts/svif-render-config.sh

      - name: Validate Worker bundle and bindings
        working-directory: mail-worker
        run: pnpm wrangler deploy --dry-run -c wrangler-svif.generated.toml

  deploy-validation:
    name: Deliver isolated validation candidate
    needs: validate
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/svif/cloudflare-validation' &&
       vars.SVIF_ENABLE_VALIDATION_DELIVERY == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: svif-validation
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact verified candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: mail-vue
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: mail-vue
        run: pnpm run build

      - name: Verify Cloudflare account/token pairing
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters."
            exit 1
          fi

          RESPONSE="$(mktemp)"
          HTTP_STATUS="$(curl --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$RESPONSE" \
            --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"

          if [ "$HTTP_STATUS" != "200" ] || ! jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" \
            '.success == true and .result.id == $id' "$RESPONSE" >/dev/null 2>&1; then
            ERROR_CODES="$(jq -r '[.errors[]?.code] | if length == 0 then "none" else map(tostring) | join(",") end' "$RESPONSE" 2>/dev/null || echo unreadable)"
            echo "::error::Cloudflare account/token pairing failed (HTTP $HTTP_STATUS, API codes: $ERROR_CODES)."
            exit 1
          fi

      - name: Discover or provision isolated KV namespace
        id: kv
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          KV_LIST="$(pnpm wrangler kv namespace list)"
          KV_ID="$(printf '%s' "$KV_LIST" | jq -r --arg name "$SVIF_KV_NAME" '.[] | select(.title == $name) | .id' | head -n1)"
          if [ -z "$KV_ID" ]; then
            pnpm wrangler kv namespace create "$SVIF_KV_NAME"
            KV_LIST="$(pnpm wrangler kv namespace list)"
            KV_ID="$(printf '%s' "$KV_LIST" | jq -r --arg name "$SVIF_KV_NAME" '.[] | select(.title == $name) | .id' | head -n1)"
          fi
          test -n "$KV_ID"
          echo "id=$KV_ID" >> "$GITHUB_OUTPUT"

      - name: Discover or provision isolated D1 database
        id: d1
        working-directory: mail-worker
        shell: bash
        run: |
          set -euo pipefail
          DB_LIST="$(pnpm wrangler d1 list --json)"
          D1_ID="$(printf '%s' "$DB_LIST" | jq -r --arg name "$SVIF_D1_NAME" '.[] | select(.name == $name) | .uuid' | head -n1)"
          if [ -z "$D1_ID" ]; then
            pnpm wrangler d1 create "$SVIF_D1_NAME"
            DB_LIST="$(pnpm wrangler d1 list --json)"
            D1_ID="$(printf '%s' "$DB_LIST" | jq -r --arg name "$SVIF_D1_NAME" '.[] | select(.name == $name) | .uuid' | head -n1)"
          fi
          test -n "$D1_ID"
          echo "id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Create ephemeral app secret and render deployment config
        id: runtime
        shell: bash
        env:
          SVIF_D1_ID: ${{ steps.d1.outputs.id }}
          SVIF_KV_ID: ${{ steps.kv.outputs.id }}
          SVIF_REVISION: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          SVIF_JWT_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$SVIF_JWT_SECRET"
          export SVIF_JWT_SECRET
          ./scripts/svif-render-config.sh
          echo "jwt_secret=$SVIF_JWT_SECRET" >> "$GITHUB_OUTPUT"

      - name: Deploy exact verified candidate
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mail-worker
          command: deploy -c wrangler-svif.generated.toml

      - name: Resolve deployment endpoint
        id: endpoint
        shell: bash
        env:
          RAW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$RAW_DEPLOYMENT_URL" | awk '{print $1}')"
          test -n "$HOST"
          case "$HOST" in
            http://*|https://*) URL="$HOST" ;;
            *) URL="https://$HOST" ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Initialize isolated D1 schema
        shell: bash
        env:
          URL: ${{ steps.endpoint.outputs.url }}
          JWT_SECRET: ${{ steps.runtime.outputs.jwt_secret }}
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/api/init/$JWT_SECRET")"
          test "$BODY" = "success"

      - name: Observe backend and stateful bindings
        shell: bash
        env:
          URL: ${{ steps.endpoint.outputs.url }}
          REVISION: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/api/health" -o health.json
          jq -e --arg revision "$REVISION" '
            .status == "ok" and
            .revision == $revision and
            .checks.d1 == true and
            .checks.kv == true and
            .checks.assets == true
          ' health.json >/dev/null
          cat health.json

      - name: Observe frontend
        shell: bash
        env:
          URL: ${{ steps.endpoint.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$URL/" -o frontend.html
          grep -q 'id="app"' frontend.html

      - name: Record observable validation evidence
        shell: bash
        env:
          URL: ${{ steps.endpoint.outputs.url }}
          REVISION: ${{ needs.validate.outputs.sha }}
        run: |
          {
            echo "### Svif Cloudflare validation"
            echo "- Revision: \`$REVISION\`"
            echo "- Endpoint: $URL"
            echo "- Worker: \`$SVIF_WORKER_NAME\`"
            echo "- D1: \`$SVIF_D1_NAME\`"
            echo "- KV: \`$SVIF_KV_NAME\`"
            echo "- Backend: \`/api/health\` observed healthy"
            echo "- Frontend: \`/\` observed with Cloud Mail app shell"
          } >> "$GITHUB_STEP_SUMMARY"
