name = "${SVIF_WORKER_NAME}"
main = "src/index.js"
compatibility_date = "2026-08-28"

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "${SVIF_D1_NAME}"
database_id = "${SVIF_D1_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${SVIF_KV_ID}"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/static/*", "/attachments/*"]

[vars]
ai_model = ""
analysis_cache = false
orm_log = false
domain = ["validation.invalid"]
admin = "svif@validation.invalid"
jwt_secret = "${SVIF_JWT_SECRET}"
project_link = "https://github.com/mattamior/cloud-mail"
# Application compatibility field retained by the predecessor validation health hook.
zerolocal_revision = "${SVIF_REVISION}"

[build]
command = "pnpm --prefix ../mail-vue install --frozen-lockfile && pnpm --prefix ../mail-vue run build"
