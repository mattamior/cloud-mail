version: 1
project:
  name: cloud-mail
  repository: mattamior/cloud-mail
zerolocal:
  protocol: v0.1
  profiles:
    - rpm
    - continuous-delivery
provider:
  id: cloudflare
  runtime: workers
  capabilities:
    deploy: true
    endpoint_discovery: true
    production_verification: true
    static_assets: true
    provisioning:
      worker: true
      d1: required
      kv: required
      r2: optional
      email_routing: optional
  credentials:
    - name: CLOUDFLARE_API_TOKEN
      store: github-actions-secret
      minimum_scope: Workers Scripts Edit plus D1 Edit and Workers KV Storage Edit for the target account
    - name: CLOUDFLARE_ACCOUNT_ID
      store: github-actions-secret
  delivery:
    validation_workflow: .github/workflows/zerolocal-validation.yml
    deployment_workflow: .github/workflows/zerolocal-validation.yml
    revision_source: resolved immutable Git commit SHA
    environment: zerolocal-validation
    verification_path: /api/health
    frontend_path: /
  validation_resources:
    worker: cloud-mail-zerolocal-validation
    d1: cloud-mail-zerolocal-validation
    kv: cloud-mail-zerolocal-validation
trust_boundaries:
  - keep Cloudflare provider credentials only in GitHub Actions protected stores
  - authorize the token for the isolated validation Worker, D1 database, and KV namespace
  - production custom domains, production databases, email routing, R2, and cron triggers are outside the validation deployment
